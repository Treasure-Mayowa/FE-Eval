<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-lingual Persona Binding — Scaling Dashboard</title>
<script src="scaling_data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #4f9cf9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .layout { display: flex; min-height: calc(100vh - 74px); }
  .sidebar {
    width: 280px; padding: 20px; border-right: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  .main { flex: 1; padding: 24px 28px; min-width: 0; }
  .control-group { margin-bottom: 22px; }
  .control-group h3 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim);
  }
  .toggle-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px;
  }
  .toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lang-list { display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; }
  .lang-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  .lang-item:hover { background: rgba(255,255,255,0.04); }
  .lang-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .lang-item.off { opacity: 0.35; }
  .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .btn-sm {
    flex: 1; padding: 5px; font-size: 12px; border: 1px solid var(--border);
    border-radius: 5px; background: transparent; color: var(--text-dim); cursor: pointer;
  }
  .chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; height: 560px; }
  .chart-title { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>Cross-lingual Persona Binding</h1>
  <p>Scaling preference expression across 14 languages · interactive explorer</p>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="control-group">
      <h3>Domain</h3>
      <div class="toggle-row" id="domain-toggles">
        <button class="toggle active" data-val="Out of Domain">Out of Domain</button>
        <button class="toggle" data-val="In Domain">In Domain</button>
      </div>
    </div>
    <div class="control-group">
      <h3>Metric</h3>
      <div class="toggle-row" id="metric-toggles">
        <button class="toggle active" data-val="delta">Δ over baseline</button>
        <button class="toggle" data-val="raw">Raw rate</button>
      </div>
    </div>
    <div class="control-group">
      <h3>Level</h3>
      <div class="toggle-row" id="level-toggles">
        <button class="toggle active" data-val="AVG">Avg</button>
        <button class="toggle" data-val="L1">L1</button>
        <button class="toggle" data-val="L3">L3</button>
        <button class="toggle" data-val="L4">L4</button>
        <button class="toggle" data-val="L5">L5</button>
      </div>
    </div>
    <div class="control-group">
      <h3>Languages</h3>
      <div class="btn-row">
        <button class="btn-sm" id="select-all">All</button>
        <button class="btn-sm" id="select-none">None</button>
        <button class="btn-sm" id="select-english">English only</button>
      </div>
      <div class="lang-list" id="lang-list"></div>
    </div>
  </div>
  <div class="main">
    <div class="chart-wrap">
      <p class="chart-title" id="chart-title"></p>
      <div style="position:relative;height:480px;"><canvas id="chart"></canvas></div>
    </div>
    <p class="hint">Click a language to toggle it. Switch metric between raw preference rate and delta over the M011 baseline. Level "Avg" averages L1/L3/L4/L5.</p>
  </div>
</div>

<script>
// ============================================================
// DATA — replace DATA below with your real exported JSON.
// Format: array of { language, domain, level, N, score, delta }
//   domain: "In Domain" | "Out of Domain"
//   level: "L1" | "L3" | "L4" | "L5"
//   N: 0..14
//   score: raw preference rate (%)
//   delta: score - baseline (%)
// See export snippet in the comment at bottom of this file.
// ============================================================
const DATA = window.SCALING_DATA || generateSampleData();

function generateSampleData() {
  // Placeholder sample data so the dashboard renders before you drop real data in.
  const langs = ['English','French','Russian','German','Chinese','Arabic','Yoruba',
    'Hindi','Spanish','Dutch','Ukrainian','Hebrew','Bengali','Romanian','Nepali'];
  const addedAt = {English:0,French:1,Russian:2,German:3,Chinese:4,Arabic:5,Yoruba:6,
    Hindi:7,Spanish:8,Dutch:9,Ukrainian:10,Hebrew:11,Bengali:12,Romanian:13,Nepali:14};
  const levels = ['L1','L3','L4','L5'];
  const rows = [];
  for (const domain of ['In Domain','Out of Domain']) {
    for (const lang of langs) {
      for (const level of levels) {
        for (let N=0; N<=14; N++) {
          const base = 50 + Math.random()*10;
          const anchored = N >= addedAt[lang];
          const idBoost = domain==='In Domain' && anchored ? 35 : 0;
          const oodBoost = domain==='Out of Domain' && anchored ? 8 : 0;
          const score = Math.min(99, base + idBoost + oodBoost + (Math.random()*8-4));
          const baseline = 45 + Math.random()*8;
          rows.push({language:lang, domain, level, N, score, delta: score-baseline});
        }
      }
    }
  }
  return rows;
}

const LANGS = [...new Set(DATA.map(d=>d.language))];
const PALETTE = ['#4f9cf9','#7bb8ff','#f5a623','#f7c873','#3ecf8e','#8ee6b8',
  '#e0524a','#f58a84','#a06bd8','#c9a8ec','#8b5e3c','#c49a7a','#e857c3','#f4a8de','#7a7f8c'];
const colorFor = {}; LANGS.forEach((l,i)=>colorFor[l]=PALETTE[i%PALETTE.length]);

const state = {
  domain: 'Out of Domain',
  metric: 'delta',
  level: 'AVG',
  active: new Set(LANGS),
};

function aggregate() {
  // returns { language: [15 values indexed by N] }
  const key = state.metric === 'delta' ? 'delta' : 'score';
  const out = {};
  for (const lang of LANGS) {
    const arr = [];
    for (let N=0; N<=14; N++) {
      let rows = DATA.filter(d => d.language===lang && d.domain===state.domain && d.N===N &&
        (state.level==='AVG' ? true : d.level===state.level));
      if (rows.length===0) { arr.push(null); continue; }
      const mean = rows.reduce((s,r)=>s+r[key],0)/rows.length;
      arr.push(mean);
    }
    out[lang] = arr;
  }
  return out;
}

let chart;
function render() {
  const agg = aggregate();
  const datasets = LANGS.filter(l=>state.active.has(l)).map(lang => ({
    label: lang,
    data: agg[lang],
    borderColor: colorFor[lang],
    backgroundColor: colorFor[lang],
    borderWidth: lang==='English' ? 3 : 1.6,
    pointRadius: 2.5,
    tension: 0.3,
    spanGaps: true,
  }));

  const labels = Array.from({length:15}, (_,i)=>i);
  const titleMetric = state.metric==='delta' ? 'Δ over M011 baseline' : 'Preference rate';
  const titleLevel = state.level==='AVG' ? 'avg L1/L3/L4/L5' : state.level;
  document.getElementById('chart-title').textContent =
    `${titleMetric} — ${state.domain} — ${titleLevel}`;

  const cfg = {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c=>`${c.dataset.label}: ${c.parsed.y?.toFixed(1)}%` } }
      },
      scales: {
        x: { title:{display:true,text:'Number of Languages (N)',color:'#9aa3b2'},
             ticks:{color:'#9aa3b2'}, grid:{color:'#262b36'} },
        y: { title:{display:true,text: state.metric==='delta'?'Δ Preference Rate (%)':'Preference Rate (%)',color:'#9aa3b2'},
             ticks:{color:'#9aa3b2'}, grid:{color:'#262b36'},
             suggestedMin: state.metric==='delta'? -20 : 0,
             suggestedMax: state.metric==='delta'? 60 : 100 }
      }
    }
  };
  if (state.metric==='delta') {
    cfg.options.plugins.annotationLine = true;
  }
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), cfg);
}

// zero line for delta
const zeroLine = {
  id: 'zeroLine',
  afterDraw(c) {
    if (state.metric!=='delta') return;
    const y = c.scales.y.getPixelForValue(0);
    const {left,right} = c.chartArea;
    const ctx = c.ctx; ctx.save();
    ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([5,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(right,y); ctx.stroke(); ctx.restore();
  }
};
Chart.register(zeroLine);

// ---- controls ----
function wireToggles(id, key) {
  document.querySelectorAll(`#${id} .toggle`).forEach(btn=>{
    btn.onclick = () => {
      document.querySelectorAll(`#${id} .toggle`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state[key] = btn.dataset.val;
      render();
    };
  });
}
wireToggles('domain-toggles','domain');
wireToggles('metric-toggles','metric');
wireToggles('level-toggles','level');

const list = document.getElementById('lang-list');
LANGS.forEach(lang=>{
  const item = document.createElement('div');
  item.className = 'lang-item';
  item.innerHTML = `<span class="lang-swatch" style="background:${colorFor[lang]}"></span>${lang}`;
  item.onclick = () => {
    if (state.active.has(lang)) { state.active.delete(lang); item.classList.add('off'); }
    else { state.active.add(lang); item.classList.remove('off'); }
    render();
  };
  list.appendChild(item);
});
document.getElementById('select-all').onclick = () => {
  LANGS.forEach(l=>state.active.add(l));
  document.querySelectorAll('.lang-item').forEach(i=>i.classList.remove('off'));
  render();
};
document.getElementById('select-none').onclick = () => {
  state.active.clear();
  document.querySelectorAll('.lang-item').forEach(i=>i.classList.add('off'));
  render();
};
document.getElementById('select-english').onclick = () => {
  state.active = new Set(['English']);
  document.querySelectorAll('.lang-item').forEach(i=>{
    i.classList.toggle('off', !i.textContent.includes('English') || i.textContent.trim()!=='English');
  });
  // fix: only English on
  document.querySelectorAll('.lang-item').forEach(i=>{
    const on = i.textContent.trim()==='English';
    i.classList.toggle('off', !on);
  });
  render();
};

render();

</script>
</body>
</html>
